[comment]
allow = false

[[grant]]
paths = ["app/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = [
    "app/src/bin/runseal/**/*.rs",
    "app/tests/**/*.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    ".runseal",
    "app/src",
    "app/tests",
    "docs",
    "skills/*",
]

[scan]
exclude = ["**/target/**"]
include = [
    ".runseal/**",
    "app/src/**/*.rs",
    "app/tests/**/*.rs",
    "docs/**/*.md",
    "skills/**/*.md",
]

[vocabulary]

[word]
single = true
