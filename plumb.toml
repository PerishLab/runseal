[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Runseal CLI and reusable library Rust workspace members."

[[layout.seat]]
path = "charts/*"
kind = "retired"
note = "This product ships no Helm chart; the tombstone keeps the domain seat absent."

[[layout.seat]]
path = "skills/*"
kind = "retired"
note = "Runseal carries no skill source; its generations are consumed from Depot through the CLI's skill commands."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the toolchain wharf builds with."

[release]
product = "runseal"
authority = "https://releases.runseal.perish.uk"
binaries = ["runseal"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[release.cargo]
registry = "perish"
packages = ["runseal"]
