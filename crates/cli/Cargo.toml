[package]
name = "runseal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "runseal"
path = "src/main.rs"

[features]
default = ["managed-skill"]
managed-skill = ["plumb/skill"]

[dependencies]
runseal = { path = "../lib", version = "=0.0.0" }
plumb = { version = "0", registry = "perish", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
locus = { version = "0", registry = "perish" }

[dev-dependencies]
plumb = { version = "0", registry = "perish", default-features = false, features = ["testing"] }
tempfile = "3.12"
