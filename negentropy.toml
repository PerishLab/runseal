[scan]
include = [
  ".runseal/**",
  "app/src/**/*.rs",
  "app/tests/**/*.rs",
  "docs/**/*.md",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  ".runseal",
  "app/src",
  "app/tests",
  "docs",
]

[limit]
block = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "environment"
paths = [
  "app/src/bin/runseal.rs",
  "app/src/core/app.rs",
  "app/src/core/config.rs",
  "app/src/wrappers.rs",
  "app/tests/**/*.rs",
]

[[grant]]
syntax = "test"
paths = [
  "app/tests/**/*.rs",
  ".runseal/**/*.test.ts",
]
