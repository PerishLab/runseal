name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Negentropy
        run: |
          set -eu
          version=$(cat .runseal/negentropy.version)
          curl -fsSL https://releases.negentropy.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-negentropy.sh"
          sh "$RUNNER_TEMP/manage-negentropy.sh" install --channel stable --version "$version" --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PWD/target/debug:$PATH"
          cargo build --quiet --locked -p runseal
          target/debug/runseal :guard

  # mac leg: verify runseal COMPILES on the real macOS target (catches mac-specific
  # build breakage). The full cargo test suite is integration-level (shells out to
  # negentropy/git/cloudflare) and needs the docker guard's environment, so it is
  # intentionally NOT run here — the docker `guard` job owns behaviour checks.
  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build on macOS
        run: |
          set -eu
          cargo build --locked -p runseal

  # windows leg: same COMPILE-only check on the windows-msvc target (PHASE-12 vmpool
  # Hyper-V runner). Mirrors guard-macos; behaviour checks stay on the docker guard.
  guard-windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build on Windows
        run: cargo build --locked -p runseal
