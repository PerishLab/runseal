name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Guard
        run: |
          set -eu
          plumb doctor .
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets --release
          cargo test --locked --workspace
          ectropy .

  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Test
        run: cargo test --locked --workspace
      - name: Cache stats
        run: sccache --show-stats

  guard-windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Test
        run: cargo test --locked --workspace
      - name: Cache stats
        run: sccache --show-stats
