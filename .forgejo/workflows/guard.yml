name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ectropy
        uses: PerishLab/actions/setup-ectropy@main

      - name: Install Plumb
        uses: PerishLab/actions/setup-plumb@main

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PWD/target/debug:$PATH"
          cargo build --quiet --locked -p runseal
          target/debug/runseal :guard

  # mac leg: verify runseal COMPILES on the real macOS target (catches mac-specific
  # build breakage). The full cargo test suite is integration-level (shells out to
  # ectropy/git/cloudflare) and needs the docker guard's environment, so it is
  # intentionally NOT run here — the docker `guard` job owns behaviour checks.
  # mac leg: COMPILE-only check on the real macOS target, split for a timing audit
  # (fetch = cargo-registry cold/warm; build = compile+link; sccache = cache hits).
  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Build
        run: cargo build --locked -p runseal
      - name: Cache stats
        run: sccache --show-stats

  # windows leg: same COMPILE-only check on the windows-msvc target (PHASE-12 vmpool
  # Hyper-V runner), split for the same timing audit.
  guard-windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch deps
        run: cargo fetch --locked
      - name: Build
        run: cargo build --locked -p runseal
      - name: Cache stats
        run: sccache --show-stats
