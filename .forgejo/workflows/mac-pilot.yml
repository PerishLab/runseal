name: mac-pilot
on: workflow_dispatch
jobs:
  build-mac:
    runs-on: macos
    steps:
      - uses: actions/checkout@v6
      - name: build runseal on macOS
        run: |
          set -eu
          uname -m; sw_vers -productVersion; cargo --version
          cargo build --locked -p runseal
          echo "MACPOOL-RUNSEAL-BUILD-OK"
